<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الشيف - لوحة تحكم الفنان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#c99a3d">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
  --ink:#0f0c09;
  --panel:rgba(24,18,13,.68);
  --gold:#c99a3d;
  --gold-light:#e8c874;
  --gold-dim:rgba(201,154,61,.35);
  --cream:#f3ead9;
  --cream-dim:rgba(243,234,217,.6);
  --err:#e0685f;
  --ok:#7cbf85;
}

body{

font-family:'Cairo',sans-serif;

background:
radial-gradient(circle at 20% 15%, rgba(201,154,61,.10), transparent 40%),
radial-gradient(circle at 85% 80%, rgba(201,154,61,.08), transparent 45%),
linear-gradient(160deg, #0f0c09, #1b140e 60%, #0f0c09);

min-height:100vh;
color:var(--cream);

display:flex;
justify-content:center;
align-items:center;

overflow-x:hidden;

padding:24px 16px;
}

.container{
width:100%;
max-width:400px;
text-align:center;
animation:fade .8s ease;
}

@keyframes fade{
from{ opacity:0; transform:translateY(16px); }
to{ opacity:1; transform:translateY(0); }
}

.badge{
width:84px;
height:84px;
margin:auto;
margin-bottom:14px;
border-radius:50%;
background:linear-gradient(135deg, var(--gold-light), var(--gold));
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
box-shadow:0 0 30px rgba(201,154,61,.4);
}

.title{
font-family:'Amiri', serif;
font-size:28px;
font-weight:700;
color:var(--gold-light);
text-shadow:0 0 22px rgba(201,154,61,.55);
margin-bottom:4px;
}

.subtitle{
color:var(--cream-dim);
font-size:12px;
font-weight:600;
letter-spacing:3px;
text-transform:uppercase;
margin-bottom:28px;
}

.card{
padding:28px 24px;
border-radius:22px;
background:var(--panel);
backdrop-filter:blur(10px);
border:1px solid var(--gold-dim);
box-shadow:0 20px 45px rgba(0,0,0,.5);
}

.form{
display:flex;
flex-direction:column;
gap:14px;
text-align:right;
}

.field label{
display:block;
font-size:12.5px;
color:var(--cream-dim);
margin-bottom:6px;
font-weight:600;
}

.field input{
width:100%;
padding:13px 14px;
border-radius:12px;
border:1px solid var(--gold-dim);
background:rgba(15,12,9,.55);
color:var(--cream);
font-family:'Cairo',sans-serif;
font-size:15px;
outline:none;
transition:.25s ease;
}

.field input:focus{
border-color:var(--gold);
box-shadow:0 0 0 3px rgba(201,154,61,.15);
}

.submit-btn{
margin-top:6px;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(135deg, var(--gold-light), var(--gold));
color:var(--ink);
font-family:'Cairo',sans-serif;
font-weight:800;
font-size:16px;
cursor:pointer;
transition:.25s ease;
}
.submit-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.submit-btn:disabled{ opacity:.6; cursor:default; transform:none; }

.msg{
font-size:13.5px;
font-weight:600;
min-height:18px;
text-align:center;
}
.msg.err{ color:var(--err); }
.msg.ok{ color:var(--ok); }

.footer{
margin-top:24px;
color:var(--cream-dim);
font-size:12px;
letter-spacing:.5px;
}
.footer span{ color:var(--gold-light); font-weight:bold; }

</style>

</head>

<body>

<div class="container">

<div class="badge">👨‍🍳</div>
<div class="title">لوحة تحكم الشيف</div>
<div class="subtitle">مطعم الفنان — دخول خاص</div>

<div class="card">

<form class="form" id="form-login" onsubmit="return false;">
<div class="field">
<label>الإيميل</label>
<input type="email" id="login-email" placeholder="example@email.com" autocomplete="email" required>
</div>
<div class="field">
<label>كلمة السر</label>
<input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
</div>
<div class="msg" id="login-msg"></div>
<button class="submit-btn" id="login-btn" onclick="doLogin()">دخول</button>
</form>

</div>

<div class="footer">
مطعم الفنان ✨ <span>لوحة الإدارة</span>
</div>

</div>

<script type="module">

import {
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

import { auth } from "./firebase.js";
import { ADMIN_EMAILS } from "./admin-config.js";

function setMsg(text, ok=false){
  const el = document.getElementById("login-msg");
  el.textContent = text;
  el.className = "msg" + (text ? (ok ? " ok" : " err") : "");
}

function translateError(code){
  const map = {
    "auth/invalid-email":"الإيميل ماشي صحيح",
    "auth/user-not-found":"ما فماش حساب بهذا الإيميل",
    "auth/wrong-password":"كلمة السر غالطة",
    "auth/invalid-credential":"الإيميل أو كلمة السر غالطة",
    "auth/too-many-requests":"محاولات برشة، جرب بعد شوية"
  };
  return map[code] || "صار خطأ، عاود جرب";
}

window.doLogin = async ()=>{
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-btn");
  setMsg("");
  if(!email || !password){ setMsg("عمر الخانات"); return; }
  btn.disabled = true; btn.textContent = "...دخول";
  try{
    const cred = await signInWithEmailAndPassword(auth, email, password);
    if(!ADMIN_EMAILS.includes(cred.user.email)){
      await signOut(auth);
      setMsg("هذا الحساب ماعندوش صلاحية الدخول للوحة التحكم");
      btn.disabled = false; btn.textContent = "دخول";
      return;
    }
    setMsg("تم الدخول ✅", true);
    window.location.href = "index.html";
  }catch(e){
    setMsg(translateError(e.code));
    btn.disabled = false; btn.textContent = "دخول";
  }
};

// إذا كان عامل login مسبقاً و صلاحياته صحيحة، نوديه دغري للوحة
onAuthStateChanged(auth, (user)=>{
  if(user && ADMIN_EMAILS.includes(user.email)){
    window.location.href = "index.html";
  }
});

</script>

</body>
</html>
