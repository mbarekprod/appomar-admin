<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>قائمة مطعم الفنان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Cairo',sans-serif;

background:

linear-gradient(
rgba(0,0,0,.82),
rgba(0,0,0,.82)
),

url('unnamed (2).jpg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

min-height:100vh;

padding:30px 15px;

overflow-x:hidden;
}

/* CONTAINER */

.container{

max-width:500px;

margin:auto;

animation:fade .8s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* LOGO */

.logo{

width:160px;
height:160px;

border-radius:50%;

overflow:hidden;

border:4px solid #ffcc33;

margin:auto;
margin-bottom:20px;

box-shadow:
0 0 20px #ffcc33,
0 0 50px rgba(255,204,51,.5);

animation:pulse 3s infinite;
}

.logo img{

width:100%;
height:100%;

object-fit:cover;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

/* TITLES */

.title{

text-align:center;

font-size:42px;

font-weight:900;

color:#ffcc33;

text-shadow:
0 0 15px rgba(255,204,51,.7);

margin-bottom:10px;
}

.subtitle{

text-align:center;

color:white;

margin-bottom:30px;

font-size:15px;

letter-spacing:2px;
}

/* CARD */

.card{

background:
rgba(0,0,0,.65);

padding:25px;

border-radius:30px;

border:2px solid #ffcc33;

backdrop-filter:blur(8px);

box-shadow:
0 0 40px rgba(255,204,51,.2);
}

/* MENU ITEM */

.item{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px;

margin:12px 0;

border-radius:18px;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,204,51,.2);

transition:.3s;
}

.item:hover{

transform:scale(1.03);

background:
rgba(255,204,51,.1);

border-color:#ffcc33;
}

.left{

display:flex;
align-items:center;
gap:15px;
}

.emoji{

font-size:28px;
}

.name{

color:white;

font-size:20px;

font-weight:700;
}

.price{

color:#ffcc33;

font-size:20px;

font-weight:900;
}

/* BACK */

.back{

display:block;

margin-top:25px;

text-align:center;

text-decoration:none;

color:#ffcc33;

font-size:18px;

transition:.3s;
}

.back:hover{

transform:scale(1.05);
}

/* MOBILE */

@media(max-width:500px){

.title{

font-size:34px;
}

.name{

font-size:17px;
}

.price{

font-size:17px;
}

.logo{

width:135px;
height:135px;
}

}

/* ===== DYNAMIC MENU (from Firestore) ===== */

.loading-msg{
color:#ffcc33;
text-align:center;
padding:20px;
font-size:16px;
}

.empty-msg{
color:rgba(255,255,255,.6);
text-align:center;
padding:20px;
font-size:15px;
}

.cat-group{
margin-bottom:22px;
}

.cat-group:last-child{
margin-bottom:0;
}

.cat-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:12px;
padding-bottom:8px;
border-bottom:2px solid rgba(255,204,51,.35);
}

.cat-header .cat-icon{
font-size:24px;
}

.cat-header .cat-name{
color:#ffcc33;
font-size:20px;
font-weight:900;
}

.item.dyn{
align-items:flex-start;
gap:12px;
}

.item .thumb{
width:52px;
height:52px;
border-radius:12px;
object-fit:cover;
flex-shrink:0;
background:rgba(255,255,255,.08);
}

.item .info{
display:flex;
flex-direction:column;
gap:3px;
}

.item .desc{
color:rgba(255,255,255,.65);
font-size:13px;
line-height:1.5;
}

.item .tags{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-top:2px;
}

.item .tag{
background:rgba(255,204,51,.15);
color:#ffcc33;
font-size:11px;
padding:2px 8px;
border-radius:10px;
}

@media(max-width:500px){
.cat-header .cat-name{
font-size:17px;
}
.item .thumb{
width:44px;
height:44px;
}
}

</style>

</head>

<body>

<audio id="bgMusic" loop>
<source src="sanfara.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="logo">

<img src="735043823_122232458936380788_691619389420209673_n (3).jpg">

</div>

<div class="title">

قائمة الفنان

</div>

<div class="subtitle">

🔥 أكلاتنا اليومية 🔥

</div>

<div class="card" id="menu-card">
  <div class="loading-msg" id="menu-loading">⏳ جارِ تحميل المنيو...</div>
</div>

<a
href="index.html"
class="back">

⬅️ الرجوع للرئيسية

</a>

</div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  onSnapshot,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const categoriesRef = collection(db, "categories");
const productsRef = collection(db, "products");

let categoriesCache = [];
let productsCache = [];
let categoriesLoaded = false;
let productsLoaded = false;

function escapeHTML(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderMenu(){
  const container = document.getElementById("menu-card");
  if (!container) return;

  if (!categoriesLoaded || !productsLoaded) {
    container.innerHTML = '<div class="loading-msg">⏳ جارِ تحميل المنيو...</div>';
    return;
  }

  const availableProducts = productsCache.filter(p => p.available !== false);

  if (categoriesCache.length === 0 || availableProducts.length === 0) {
    container.innerHTML = '<div class="empty-msg">📭 المنيو قيد التحضير، تابعونا قريب!</div>';
    return;
  }

  let html = "";
  categoriesCache.forEach(cat => {
    const items = availableProducts.filter(p => p.categoryId === cat.id);
    if (items.length === 0) return;

    html += `<div class="cat-group">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon || "📂"}</span>
        <span class="cat-name">${escapeHTML(cat.name)}</span>
      </div>`;

    items.forEach(p => {
      html += `<div class="item dyn">
        ${p.image ? `<img class="thumb" src="${escapeHTML(p.image)}" alt="">` : ""}
        <div class="left" style="flex:1;">
          <div class="info">
            <div class="name">${escapeHTML(p.name)}</div>
            ${p.description ? `<div class="desc">${escapeHTML(p.description)}</div>` : ""}
            ${p.tags && p.tags.length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join("")}</div>` : ""}
          </div>
        </div>
        <div class="price">${p.price} ${escapeHTML(p.currency || "د")}</div>
      </div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html || '<div class="empty-msg">📭 المنيو قيد التحضير، تابعونا قريب!</div>';
}

onSnapshot(query(categoriesRef, orderBy("createdAt", "asc")), (snap) => {
  categoriesCache = [];
  snap.forEach(d => categoriesCache.push({ id: d.id, ...d.data() }));
  categoriesLoaded = true;
  renderMenu();
});

onSnapshot(query(productsRef, orderBy("createdAt", "desc")), (snap) => {
  productsCache = [];
  snap.forEach(d => productsCache.push({ id: d.id, ...d.data() }));
  productsLoaded = true;
  renderMenu();
});
</script>

<script>
const music = document.getElementById("bgMusic");
music.volume = 0.5;

function applySavedTime(){
    try{
        const savedTime = localStorage.getItem("musicTime");
        if (savedTime && music.readyState > 0) {
            music.currentTime = parseFloat(savedTime);
        }
    } catch(e){}
}

if (music.readyState > 0) {
    applySavedTime();
} else {
    music.addEventListener("loadedmetadata", applySavedTime);
}

setInterval(() => {
    try { localStorage.setItem("musicTime", music.currentTime); } catch(e){}
}, 1000);

try {
    const muted = localStorage.getItem("musicMuted");
    if (muted === "true") { music.muted = true; }
} catch(e){}

function startMusic() {
    music.play().catch(() => {});
}

window.addEventListener("load", startMusic);
startMusic();

function unlockOnce() {
    startMusic();
    document.removeEventListener("click", unlockOnce);
    document.removeEventListener("touchstart", unlockOnce);
    document.removeEventListener("scroll", unlockOnce);
    document.removeEventListener("keydown", unlockOnce);
}

document.addEventListener("click", unlockOnce);
document.addEventListener("touchstart", unlockOnce);
document.addEventListener("scroll", unlockOnce);
document.addEventListener("keydown", unlockOnce);
</script>

</body>
</html>
